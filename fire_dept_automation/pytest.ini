[pytest]
# Pytest 配置檔案

# 測試檔案搜尋模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 測試目錄
testpaths = tests

# 顯示詳細輸出
addopts = 
    -v
    --tb=short
    --strict-markers
    -s

# 標記定義
markers =
    slow: 標記為慢速測試
    integration: 標記為整合測試
    unit: 標記為單元測試
    security: 標記為安全性測試

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
