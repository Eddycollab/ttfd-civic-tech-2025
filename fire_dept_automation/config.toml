# ==========================================
# 系統設定檔 (Configuration File)
# ==========================================
# 本檔案包含所有機構相關的設定，方便其他縣市移植使用
# 修改此檔案即可將系統套用到不同的消防局

[agency]
# 機構資訊
name = "臺東縣消防局"
department = "預防調查科"
full_name = "臺東縣消防局預防調查科"

# 聯絡資訊
phone = "089-XXXXXX"
address = "臺東縣臺東市XXX路XXX號"
email = "example@example.gov.tw"

[system]
# 系統名稱
title = "消防安全設備檢修申報平台"
page_title = "消防安全設備檢修申報"
subtitle = "Fire Safety Equipment Inspection Automation System"

# 註冊通行碼（內部同仁註冊用）
registration_key = "${REGISTRATION_KEY}"

[ui]
# Logo 與圖示
logo_path = "assets/logo.png"
favicon = "🚒"

# 主題顏色
primary_color = "#e53e3e"  # 消防紅
secondary_color = "#1a365d"  # 深藍

[email]
# Email 簽名檔
signature_org = "臺東縣消防局 預防調查科 敬啟"
auto_reply_notice = "【系統自動發信，請勿直接回覆】"

[ocr]
# OCR 預設路徑
default_excel_path = "d:\\下載\\downloads\\00. 列管場所資料.xls"
default_tesseract_path = "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"

[features]
# 功能開關
enable_2fa = true  # 管理員二階段驗證
enable_line_notify = false  # LINE 通知（開發中）
enable_ocr = true  # OCR 比對功能
enable_self_registration = true  # 內部同仁自助註冊
enable_meal_delivery = true  # 社區送餐系統
enable_museum_booking = false  # 防災館預約系統（暫停開放）

[meal_delivery]
# 送餐系統設定
system_name = "社區互助送餐系統"
max_upload_size_mb = 10
photo_quality = 85
photo_max_width = 800
backup_retention_days = 30

[museum]
# 防災教育館設定
name = "防災教育館"
phone = "089-XXXXXX"
email = "museum@ttfd.gov.tw"
address = "臺東縣臺東市中山路XXX號"
maps_url = "https://www.google.com/maps/search/防災教育館"
facebook_url = "https://www.facebook.com/"

# 營運時間
opening_hours = "週二至週日 09:00-17:00"
closed_days = "每週一"
last_entry = "16:30"

# 預約設定
max_visitors_per_slot = 50
booking_advance_days = 60
